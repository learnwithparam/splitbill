name: Dependency upgrade
description: Bump a package to a newer version.
labels: ["dependency"]
body:
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: hono
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Current -> target version
      placeholder: 3.12.12 -> 4.9.9
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
      description: Advisory id, EOL, blocking a feature, or routine upkeep.
    validations:
      required: true
