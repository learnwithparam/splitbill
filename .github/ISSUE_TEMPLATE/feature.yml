name: Feature request
description: Propose a new capability or change to splitbill.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't a user do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be possible once this ships?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria (optional)
      description: If you already know how to check this is done, list it - the planning agent will propose these if left blank.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What should this request explicitly NOT include?
    validations:
      required: false
