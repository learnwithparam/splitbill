name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install uv (for skills-ref validate)
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: make install

      - name: Run gates
        run: bash .factory/gates.sh
